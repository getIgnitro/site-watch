<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Afro Waves kiosk has closed — Afro Fusion Restaurant</title>
<meta name="description" content="The Afro Waves kiosk at Desert Falls was a one-day event. Find Afro Fusion Restaurant in Najma, Doha.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0C2657;--cobalt:#1B4FA0;--sun:#FFC72C;--lime:#C6D93A;--red:#E0342C;--cream:#FFF7E9}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    background:radial-gradient(70% 38% at 50% 6%,rgba(255,199,44,.18),rgba(255,199,44,0) 72%),
               radial-gradient(130% 95% at 50% 0%,#1B4FA0 0%,#0C2657 64%,#081B3F 100%);
    color:#fff;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.5;text-align:center;
  }
  .kente{height:6px;background:repeating-linear-gradient(90deg,var(--sun) 0 18px,var(--red) 18px 30px,var(--lime) 30px 48px,var(--cream) 48px 58px)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px}
  .logo{width:min(260px,78%);height:auto;margin:0 auto 26px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
  .tag{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--sun);margin:0 0 6px}
  h1{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;
     font-size:clamp(34px,9vw,52px);line-height:1.05;margin:0 0 16px}
  p{max-width:30em;margin:0 auto 10px;color:rgba(255,255,255,.86)}
  .where{font-weight:700;color:#fff;margin-top:18px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-block;min-width:150px;padding:13px 22px;border-radius:999px;font-weight:700;text-decoration:none}
  .wa{background:var(--sun);color:var(--navy)}
  .ig{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
  .btn:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<div class="kente" aria-hidden="true"></div>
<main>
  <img class="logo" src="img/logo-white.png" alt="Afro Fusion Restaurant" width="1865" height="579">
  <p class="tag">Afro Waves · Desert Falls</p>
  <h1>The kiosk has closed</h1>
  <p>Afro Waves was a one-day event on 25 September. Thank you to everyone who came by and ate with us.</p>
  <p class="where">We are in Najma, Doha.</p>
  <div class="btns">
    <a class="btn wa" href="https://wa.me/97470995865">WhatsApp</a>
    <a class="btn ig" href="https://instagram.com/afrofusionrestaurant.qatar">Instagram</a>
  </div>
</main>
<div class="kente" aria-hidden="true"></div>
</body>
</html>
